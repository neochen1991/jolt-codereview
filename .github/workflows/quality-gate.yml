name: Jolt CodeReview Quality Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  schedule:
    - cron: "0 18 * * 0"

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install root dependencies
        run: npm ci

      - name: Install module dependencies
        run: |
          npm --prefix common-backend install --no-audit --no-fund
          npm --prefix mr-backend install --no-audit --no-fund
          npm --prefix frontend install --no-audit --no-fund

      - name: Install MR worker dependencies
        run: |
          python -m venv mr-backend/.venv
          mr-backend/.venv/bin/python -m pip install --upgrade pip
          mr-backend/.venv/bin/python -m pip install -r mr-backend/requirements.txt

      - name: Build and verify split modules
        run: npm run verify

      - name: Verify worker Python syntax
        run: python -m compileall mr-backend/worker scripts

      - name: Verify real tooling guards
        run: node scripts/verify-real-tooling.mjs

      - name: Verify skill layer loading
        run: env PYTHONPATH=mr-backend/worker mr-backend/.venv/bin/python scripts/verify_skill_layers.py
